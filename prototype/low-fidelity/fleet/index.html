<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#26477c" />
  <title>Geotab Video · Fleet wireframe</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./refinements.css" />
  <link rel="stylesheet" href="./wireframe.css" />
  <script defer src="./main.js"></script>
</head>
<body>
  <div class="phone" aria-label="Fleet wireframe version two">
    <header class="top">
      <div class="status-bar" aria-hidden="true"><span class="clock">9:41</span><span class="system-icons"><img src="../../high-fidelity/home/assets/imgCombinedShape.svg" alt="" /><img src="../../high-fidelity/home/assets/imgCombinedShape1.svg" alt="" /><img src="../../high-fidelity/home/assets/imgBatteryIcon.svg" alt="" /></span></div>
      <div class="top-title"><button class="header-back" id="back-button" type="button" aria-label="Back to Fleet" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7" /></svg></button><h1 id="screen-title">Fleet</h1><button class="header-contact" id="contact-button" type="button" aria-label="Contact driver" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.1 3.5h2.3l1.2 4.1-1.8 1.7a15.5 15.5 0 0 0 5.9 5.9l1.7-1.8 4.1 1.2v2.3a2.2 2.2 0 0 1-2.4 2.2A16.6 16.6 0 0 1 4.9 5.9 2.2 2.2 0 0 1 7.1 3.5Z"/></svg></button></div>
    </header>

    <main class="content" id="content">
      <div class="tabs" id="fleet-tabs" role="tablist" aria-label="Fleet views"><button class="tab active" id="vehicles-tab" role="tab" aria-selected="true" type="button">Vehicles</button><button class="tab" id="drivers-tab" role="tab" aria-selected="false" type="button">Drivers</button></div>

      <section class="overview" id="vehicles-view" aria-label="Vehicles">
        <div class="attention-group"><div class="group-heading"><h2>Needs attention</h2></div><div class="attention-grid" id="vehicle-attention"></div></div>
        <div class="list-heading"><h2>Other vehicles</h2><button class="text-link" type="button" data-all="vehicles">View all</button></div>
        <div class="entity-list" id="vehicle-preview"></div>
      </section>

      <section class="overview" id="drivers-view" aria-label="Drivers" hidden>
        <div class="attention-group"><div class="group-heading"><h2>Needs attention</h2></div><div class="attention-grid" id="driver-attention"></div></div>
        <div class="list-heading"><h2>Other drivers</h2><button class="text-link" type="button" data-all="drivers">View all</button></div>
        <div class="entity-list" id="driver-preview"></div>
      </section>

      <section id="all-view" aria-label="All fleet items" hidden><div class="all-heading"><h2 id="all-title">All vehicles</h2><span id="all-count"></span></div><div class="entity-list" id="all-list"></div></section>

      <section class="detail-view" id="vehicle-detail" aria-label="Vehicle detail" hidden>
        <div class="vehicle-heading-row"><div class="vehicle-title-cluster"><span class="identity-icon"><img src="../../high-fidelity/home/assets/imgTruck.svg" alt="" /></span><div><h2 id="vehicle-name"></h2><p id="vehicle-driver"></p></div></div><span class="vehicle-status" id="vehicle-status"></span></div>
        <div class="vehicle-actions" aria-label="Vehicle actions">
          <button type="button" id="live-shortcut"><span class="action-icon"><img src="../../../presentation/assets/icons/camera.svg" alt="" /></span><span>Live video</span></button>
          <button type="button" id="map-shortcut"><span class="action-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span>Location</span></button>
          <button type="button" id="driver-shortcut"><span class="action-icon"><img src="../../../presentation/assets/icons/user-round.svg" alt="" /></span><span>Driver</span></button>
        </div>
        <section class="camera-overview" id="camera-section" aria-label="Camera status and live video">
          <span class="row-symbol"><img src="../../../presentation/assets/icons/camera.svg" alt="" /></span>
          <div class="camera-overview-copy"><strong id="vehicle-camera"></strong><small id="vehicle-last-seen"></small><span id="video-description"></span></div>
          <button id="video-button" type="button"></button>
        </section>
      </section>

      <section class="detail-view" id="driver-detail" aria-label="Driver detail" hidden>
        <div class="driver-identity"><span class="driver-avatar" id="driver-initials"></span><div><h2 id="driver-name"></h2><p id="driver-vehicle"></p></div><div class="driver-score-tile" aria-label="Safety score"><small>Safety score</small><strong id="driver-score"></strong></div></div>
        <div class="driver-overview-card"><span class="known-for-title">Known for</span><div class="driver-behavior-tags" id="driver-top-behaviors"></div></div>
        <h3 class="more-heading">More info</h3>
        <div class="driver-more-list">
          <button class="detail-entry" id="driver-trend-button" type="button"><span><strong>Safety trend</strong><small>Last 30 days</small></span><span class="entry-trailing"><span class="trend-tag" id="driver-trend-tag"></span><span class="chevron" aria-hidden="true"></span></span></button>
          <button class="detail-entry" id="driver-details-button" type="button"><span><strong>Behavior details</strong><small>Event counts</small></span><span class="chevron" aria-hidden="true"></span></button>
        </div>
      </section>
    </main>

    <div class="sheet-backdrop" id="driver-sheet-backdrop" hidden></div>
    <section class="driver-sheet" id="driver-sheet" role="dialog" aria-modal="true" aria-labelledby="driver-sheet-title" hidden><div class="sheet-handle" aria-hidden="true"></div><button class="sheet-close" id="driver-sheet-close" type="button" aria-label="Close driver details">×</button><h2 id="driver-sheet-title">Behavior details</h2><div class="sheet-trend" id="sheet-trend" hidden><p>Last 30 days</p><div class="trend-frame"><div class="chart-lines" aria-hidden="true"></div><svg viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true"><polyline id="trend-line" points="" /></svg></div><p class="trend-caption" id="trend-caption"></p></div><div class="sheet-behaviors" id="sheet-behaviors"><h3>Known behaviors</h3><div class="behavior-list" id="behavior-list"></div></div><div class="sheet-contact" id="sheet-contact" hidden><div class="contact-choices"><button type="button" disabled>Call driver</button><button type="button" disabled>Send email</button></div><p>Contact information unavailable.</p></div></section>

    <div class="sheet-backdrop" id="vehicle-sheet-backdrop" hidden></div>
    <section class="vehicle-location-sheet" id="vehicle-location-sheet" role="dialog" aria-modal="true" aria-labelledby="location-sheet-title" hidden><div class="sheet-handle" aria-hidden="true"></div><button class="sheet-close" id="vehicle-sheet-close" type="button" aria-label="Close location">×</button><h2 id="location-sheet-title">Vehicle location</h2><p id="location-sheet-status"></p><div class="sheet-map" aria-label="Location preview"><div class="street-grid" aria-hidden="true"></div><span class="map-point" aria-hidden="true"></span><span class="map-label" id="map-label"></span></div></section>

    <nav class="bottom-nav" aria-label="Main navigation"><a class="nav-item" href="../home/index.html"><img src="../../high-fidelity/home/assets/imgGroup.svg" alt="" /><span>Home</span></a><span class="nav-item selected" aria-current="page"><img src="../../high-fidelity/home/assets/imgTruck.svg" alt="" /><span>Fleet</span></span><span class="nav-item"><img src="../../high-fidelity/home/assets/imgImage.png" alt="" /><span>Profile</span></span></nav><div class="home-indicator" aria-hidden="true"></div>
  </div>
</body>
</html>
